<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4">

        <h3 class="mb-3">➕ Add Student</h3>

        <form method="POST" enctype="multipart/form-data">

            <input class="form-control mb-2" name="name" placeholder="Name" required>
            <input class="form-control mb-2" name="age" placeholder="Age" required>
            <input class="form-control mb-2" name="course" placeholder="Course" required>
            <input class="form-control mb-2" type="date" name="date" required>

            <!-- 🔐 NEW LOGIN FIELDS -->
            <input class="form-control mb-2" name="username" placeholder="Student ID (login)" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

            <input class="form-control mb-3" type="file" name="image">

            <div class="d-flex gap-2">
                <button class="btn btn-success w-100">Add Student</button>
                <a href="/dashboard" class="btn btn-secondary w-100">Back</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
