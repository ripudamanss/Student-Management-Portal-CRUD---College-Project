<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #ece9e6, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .profile-card {
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease;
        }

        img {
            border-radius: 50%;
            transition: 0.3s;
        }

        img:hover {
            transform: scale(1.1);
        }

        .btn {
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card profile-card text-center">

        <img src="/static/uploads/{{s[5]}}" width="120" class="mb-3">

        <h3>{{s[1]}}</h3>

        <div class="mt-3">
            <p><b>Age:</b> {{s[2]}}</p>
            <p><b>Course:</b> <span class="badge bg-info">{{s[3]}}</span></p>
            <p><b>Date:</b> {{s[4]}}</p>
        </div>

        <a href="/dashboard" class="btn btn-dark mt-3">⬅ Back</a>

    </div>
</div>

</body>
</html>
